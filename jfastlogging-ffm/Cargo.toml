[package]
name = "jfastlogging-ffm"
version = "0.8.0"
authors = ["Martin Bammer <mrbm74@gmail.com>"]
description = "A lightning fast logger, written in Rust, for multiple platforms and languages."
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/brmmm3/fastlogging-rs"
homepage = "https://github.com/brmmm3/fastlogging-rs/jfastlogging-ffm"
keywords = ["logging", "logger"]

[dependencies]
once_cell = "1.21"
parking_lot = "0.12"
fastlogging = { path = "../fastlogging" }

[lib]
crate-type = ["cdylib"]

[build-dependencies]
cbindgen = "0.29"
