[package]
name = "cfastlogging"
version = "0.8.1"
edition = "2024"
authors = ["Martin Bammer <mrbm74@gmail.com>"]
description = "A lightning fast logger, written in Rust, for multiple platforms and languages."
license = "MIT OR Apache-2.0"
repository = "https://github.com/brmmm3/fastlogging-rs"
keywords = ["logging", "logger"]
categories = ["development-tools::debugging"]
include = [
    "Cargo.toml",
    "src/*",
    "tests/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "cfastlogging"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
once_cell = "1.21"
parking_lot = "0.12"
rand = "0.10"
fastlogging = { path = "../fastlogging", version = "0.8.1" }
