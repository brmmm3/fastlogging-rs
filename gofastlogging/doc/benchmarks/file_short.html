<!DOCTYPE html>
<html>

<head>
  <title>Go Logging benchmark results</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script type="text/javascript">
    google.charts.load('current', { 'packages': ['bar'] });
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
      var data = google.visualization.arrayToDataTable([
        ['Log level', 'gofastlogging', 'slog', 'logrus'],
        ['DEBUG', 0.1959, 0.5826, 0.5906],
        ['INFO', 0.1554, 0.5849, 0.5925],
        ['WARNING', 0.1104, 0.5855, 0.5948],
        ['ERROR', 0.0629, 0.5878, 0.5930],
        ['CRITICAL', 0.0462, 0.5942, 0.5967]
      ]);

      var options = {
        chart: {
          title: 'Log file — short',
        },
        bars: 'horizontal' // Required for Material Bar Charts.
      };

      var chart = new google.charts.Bar(document.getElementById('barchart_material'));

      chart.draw(data, google.charts.Bar.convertOptions(options));
    }
  </script>
</head>

<body>
  <div id="barchart_material" style="width: 900px; height: 500px;"></div>
</body>

</html>
