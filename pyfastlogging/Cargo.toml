[package]
name = "pyfastlogging"
version = "0.8.0"
edition = "2024"
authors = ["Martin Bammer <mrbm74@gmail.com>"]
description = "A lightning fast logger, written in Rust, for multiple platforms and languages."
license = "MIT OR Apache-2.0"
repository = "https://github.com/brmmm3/fastlogging-rs"
homepage = "https://github.com/brmmm3/fastlogging-rs/pyfastlogging"
keywords = [
    "logging",
    "logger",
    "logging-framework",
    "logging-library",
    "logging-system",
    "logging-tool",
    "logging-utility",
    "logging-service",
    "logging-solution",
    "logging-application",
    "logging-software",
    "logging-platform",
    "logging-infrastructure",
    "logging-environment",
    "logging-ecosystem",
    "logging-stack",
    "logging-suite",
    "logging-package",
    "logging-module",
    "logging-component",
    "logging-subsystem",
]
include = [
    "Cargo.toml",
    "pyproject.toml",
    "src/*",
    "test/*.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[lib]
name = "pyfastlogging"
crate-type = ["cdylib", "rlib"]

[dependencies]
once_cell = "1.21"
parking_lot = "0.12"
pyo3 = { version = "0.29", features = ["extension-module"] }
fastlogging = { path = "../fastlogging", version = "0.8.0" }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "auto-initialize"] }
